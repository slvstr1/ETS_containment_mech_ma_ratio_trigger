[paths]
output_data_dir = "data_output"
output_figures = "data_output/figures/"
log_dir = "data_log"


# ==============================================================================
# HISTORICAL PLOT CONFIGURATION (03_Historical Plot of Prices and MA Ratios.py)
# ==============================================================================

# Moving Average Ratio pairs to calculate and plot (p1 = preceding base, p2 = recent window)
[[plotting.ma_ratios]]
p1 = 24
p2 = 6
label = "ETS1: MA(6) / MA(24)"
color = "#1f77b4"
linestyle = "-"
linewidth = 2.0

[[plotting.ma_ratios]]
p1 = 6
p2 = 3
label = "ETS2 / Old ETS1: MA(3) / MA(6)"
color = "#2ca02c"
linestyle = "-"
linewidth = 2.0

# Regulatory trigger thresholds (m)
[[plotting.thresholds]]
label = "ETS1 Trigger (m = 2.4)"
y = 2.4
color = "#d62728"
linestyle = "--"
linewidth = 1.5

[[plotting.thresholds]]
label = "ETS2 Future Trigger (m = 2.0)"
y = 2.0
color = "#7b2cbf"
linestyle = "--"
linewidth = 1.5

[[plotting.thresholds]]
label = "ETS2 Standard Trigger (m = 1.5)"
y = 1.5
color = "#ff7f0e"
linestyle = "--"
linewidth = 1.5

[[plotting.thresholds]]
label = "Old ETS1 Trigger (m = 3.0)"
y = 3.0
color = "#8c564b"
linestyle = ":"
linewidth = 1.5

# Parity line settings (y = 1.0)
[plotting.parity_line]
show = true
y = 1.0
color = "black"
linestyle = "-"
linewidth = 1.2
alpha = 0.7
show_labels = true
x_pos = 0.015
font_size = 10
font_weight = "bold"
label_color = "black"
label_alpha = 0.85
bbox_show = true
bbox_pad = 0.2
bbox_color = "white"
bbox_alpha = 0.50
y_offset_upper = 0.04
label_upper = "▲ Increase"
y_offset_lower = 0.04
label_lower = "▼ Reduction"

# Historical price line aesthetic options
[plotting.historical_price]
color = "red"
linestyle = "-"
linewidth = 2.2
